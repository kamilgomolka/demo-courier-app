name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OS: latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify toolchain
        run: |
          xcodebuild -version | tee /dev/stderr | grep -q "Xcode 26.6"
          xcrun simctl list runtimes

      # Simulator device names change between Xcode releases; this makes a
      # destination mismatch diagnosable from the log instead of guesswork.
      - name: List available destinations
        run: make destinations

      - name: Build and test
        run: make test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            PackageTestResults.xcresult
            TestResults.xcresult

  lint:
    name: Lint
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Verify toolchain
        run: xcrun swift-format --version | tee /dev/stderr | grep -q "^6.3"

      - name: Check formatting
        run: make lint
